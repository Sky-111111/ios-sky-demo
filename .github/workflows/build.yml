      - name: Compile Objective‑C code
        run: |
          mkdir -p Payload/Sky.app
          xcrun clang -arch arm64 -target arm64-apple-ios15.0 \
          -isysroot $(xcrun --sdk iphoneos --show-sdk-path) \
          -fobjc-arc \
          -framework UIKit -framework Foundation \
          Sky.m -o Payload/Sky.app/Sky

          cp Info.plist Payload/Sky.app/Info.plist
